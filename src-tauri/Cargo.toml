[package]
name = "metricks"
version = "0.1.0"
description = "Metricks — десктопный дашборд метрик"
authors = ["Elisey Lomtev"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri's CLI ожидает библиотеку с именем <name>_lib, иначе не собирает приложение.
name = "metricks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
